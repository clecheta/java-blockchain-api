# Baseline for every @QuarkusTest (all TestProfiles). CI has no Docker —
# never enable Dev Services; pin URLs to compose (local) or GitLab services (TEST_*).
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:postgresql://${TEST_DB_HOST:localhost}:5432/${POSTGRES_DB:blockchain}
quarkus.datasource.username=${POSTGRES_USER:blockchain}
quarkus.datasource.password=${POSTGRES_PASSWORD:blockchain}
kafka.bootstrap.servers=${TEST_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.flyway.migrate-at-start=true
quarkus.http.test-port=0
