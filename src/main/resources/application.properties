root.node.address=http://localhost:8018
ledger.node.role=settler
%node.ledger.node.role=peer

#mining.reward.input=*authorized-reward*
#mining.reward.value=01
mining.reward.enabled=false
mining.reward.wallet=9385186a-1c20-45a4-9595-579eb87353e0

# Batch settlement. Production should use the equivalent managed cloud
# scheduler (AWS/GCP/Azure) against the same endpoint. In-process scheduling is
# a portable dev/fallback and is disabled until configured.
mining.settlement.enabled=true
mining.settlement.cron=disabled
mining.settlement.min-pool-size=1
mining.settlement.max-batch-size=500
%node.mining.settlement.enabled=false
%test.mining.settlement.enabled=true
%test.mining.settlement.cron=disabled

# Bootstrap credentials are local/test only. Production startup requires
# BANK_SERVICE_API_KEY and BANK_CLIENT_API_KEY.
bank.service.api-key=${BANK_SERVICE_API_KEY}
bank.client.api-key=${BANK_CLIENT_API_KEY}
%dev.bank.service.api-key=local-development-only-change-me
%dev.bank.client.api-key=local-client-only-change-me
%test.bank.service.api-key=local-development-only-change-me
%test.bank.client.api-key=local-client-only-change-me
bank.security.enabled=true
bank.idempotency.required=true
bank.velocity.max-transfers-per-minute=1000

# Boot trusts PostgreSQL as chain SoT (skip full peer revalidation). Set false
# only for forensic rebuilds that must re-run isValidTransactionData.
ledger.boot.trust-persisted-chain=true
# Diagnostic profile only: isolate accept-path TPS from Kafka fan-out.
ledger.diagnostic.skip-transaction-broadcast=false
%diagnostic-kafka-quiet.ledger.diagnostic.skip-transaction-broadcast=true
%test.bank.security.enabled=false
%test.bank.idempotency.required=false
%security-enabled.bank.security.enabled=true
%security-enabled.bank.client.api-key=test-client-key
%security-enabled.bank.service.api-key=test-service-key

#must have a different port/id for each node
quarkus.http.port=8018
mp.messaging.connector.smallrye-kafka.group.id=18
%node.quarkus.http.port=8081
%node.mp.messaging.connector.smallrye-kafka.group.id=81

quarkus.ssl.native=true
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=POST

# Runtime / local: fixed Mongo + Kafka from docker compose (disable Dev Services).
%dev.quarkus.mongodb.connection-string=mongodb://localhost:27017
%node.quarkus.mongodb.connection-string=mongodb://localhost:27017
%prod.quarkus.mongodb.connection-string=mongodb://localhost:27017
%dev.kafka.bootstrap.servers=localhost:9092
%node.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=false
%node.quarkus.kafka.devservices.enabled=false
%prod.quarkus.kafka.devservices.enabled=false
%dev.quarkus.mongodb.devservices.enabled=false
%node.quarkus.mongodb.devservices.enabled=false
%prod.quarkus.mongodb.devservices.enabled=false

# Queryable ledger source of truth (P2 / api#43).
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/blockchain
%node.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/blockchain
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/blockchain
%dev.quarkus.datasource.username=blockchain
%node.quarkus.datasource.username=blockchain
%prod.quarkus.datasource.username=blockchain
%dev.quarkus.datasource.password=blockchain
%node.quarkus.datasource.password=blockchain
%prod.quarkus.datasource.password=blockchain
%dev.quarkus.datasource.jdbc.min-size=16
%dev.quarkus.datasource.jdbc.max-size=40
%node.quarkus.datasource.jdbc.min-size=16
%node.quarkus.datasource.jdbc.max-size=40
%prod.quarkus.datasource.jdbc.min-size=16
%prod.quarkus.datasource.jdbc.max-size=40
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.statement-batch-size=100
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true
quarkus.flyway.migrate-at-start=true
ledger.migration.mongo.enabled=false
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true

# QuarkusTest uses %test — Dev Services for Mongo + Kafka (no fixed localhost:27017).
# GitLab CI: Maven profile "gitlab-ci" (activated by env.GITLAB_CI) injects Surefire
# system properties that disable Dev Services and point at CI service aliases.
# (@QuarkusTest forces Quarkus profile "test", so QUARKUS_PROFILE=%gitlab-ci is ignored.)
%test.quarkus.mongodb.devservices.enabled=true
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.http.test-port=0


# Prometheus metrics are exposed at /q/metrics. Production traces use OTLP;
# local and test builds retain context propagation without exporting.
quarkus.otel.traces.exporter=cdi
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
%node.quarkus.otel.sdk.disabled=true
# Optional collector endpoint for packaged/prod runs. Empty keeps local
# capacity packaging usable without an OTLP collector.
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}
%prod.quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c] (%t) %s%e%n

# Mongo is an optional migration source, not a runtime readiness dependency.
quarkus.mongodb.health.enabled=false


# Kafka source (we read from it)
mp.messaging.incoming.blockchain-in.connector=smallrye-kafka
mp.messaging.incoming.blockchain-in.topic=blockchain
mp.messaging.incoming.blockchain-in.value.deserializer=api.network.model.ChainBlockMessageDeserializer

mp.messaging.incoming.transaction-in.connector=smallrye-kafka
mp.messaging.incoming.transaction-in.topic=transactions
mp.messaging.incoming.transaction-in.value.deserializer=api.cryptocurrency.model.TransactionDeserializer

mp.messaging.incoming.cryptochain-in.connector=smallrye-kafka
mp.messaging.incoming.cryptochain-in.topic=cryptochain
mp.messaging.incoming.cryptochain-in.value.deserializer=api.network.model.CryptoBlockMessageDeserializer

# Configuring the outgoing channels (writing to Kafka)
mp.messaging.outgoing.blockchain-to-kafka.connector=smallrye-kafka
mp.messaging.outgoing.blockchain-to-kafka.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.blockchain-to-kafka.topic=blockchain
mp.messaging.outgoing.blockchain-to-kafka.broadcast=true

mp.messaging.outgoing.transaction-to-kafka.connector=smallrye-kafka
mp.messaging.outgoing.transaction-to-kafka.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.transaction-to-kafka.topic=transactions
mp.messaging.outgoing.transaction-to-kafka.broadcast=true

mp.messaging.outgoing.cryptochain-to-kafka.connector=smallrye-kafka
mp.messaging.outgoing.cryptochain-to-kafka.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.cryptochain-to-kafka.topic=cryptochain
mp.messaging.outgoing.cryptochain-to-kafka.broadcast=true

#wallet.faucet.address=f5f5877e-bc3d-4ba4-824a-96e0bc63d14c