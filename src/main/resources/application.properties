quarkus.http.port=8080
%node.quarkus.http.port=8081

#quarkus.http.cors=true
#quarkus.http.cors.methods=POST

quarkus.mongodb.connection-string=mongodb://localhost:27017

# Kafka source (we read from it)
mp.messaging.incoming.blockchain-in.connector=smallrye-kafka
mp.messaging.incoming.blockchain-in.topic=blockchain
mp.messaging.incoming.blockchain-in.value.deserializer=api.blockchain.BlockchainDeserializer

# Configuring the outgoing channels (writing to Kafka)
#mp.messaging.outgoing.blockchain-out.connector=smallrye-kafka
#mp.messaging.outgoing.blockchain-out.topic=blockchain
#mp.messaging.outgoing.blockchain-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.blockchain-to-kafka.connector=smallrye-kafka
mp.messaging.outgoing.blockchain-to-kafka.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.blockchain-to-kafka.topic=blockchain