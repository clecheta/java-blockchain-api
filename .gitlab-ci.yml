image: docker:latest
services:
  - docker:dind
  
stages:
  - test
  - build
  - package

before_script:
  - echo "before script"
  - echo $CI_COMMIT_BRANCH

integration:
  stage: test
  image: openjdk:17
  services:
    - name: git.okaut.com:5050/infra/test/mongo:blockchain
      alias: blockchain_db
  script:
    - ./mvnw test -B -s ci_settings.xml -Dquarkus.mongodb.connection-string=mongodb://blockchain_db:27017

graalvm.native:
  stage: build
  image: ghcr.io/graalvm/graalvm-ce:22.0.0.2
  before_script:
    - gu install native-image
  script:
    - ./mvnw package -s ci_settings.xml -Pnative -DskipTests=true
  artifacts:
    paths:
      - target/*-runner

docker.test:
  stage: package
  image:
    name: docker:dind
  tags:
    - dind
  before_script:
    - docker info
    - docker login -u gitlab-ci-token -p $INFRA_TEST_TOKEN $CI_REGISTRY
  script:
    - docker build -f src/main/docker/Dockerfile.native -t $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA $CI_REGISTRY/infra/test/api.blockchain:latest
    - docker push $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY/infra/test/api.blockchain:latest
  environment:
    name: test
  only:
    - master