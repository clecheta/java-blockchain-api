variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_DRIVER: overlay
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

stages:
  - test
  - build
  - package

# Explicit Postgres/Mongo/Kafka services. %test pins URLs (no Dev Services / Testcontainers).
# TEST_* hosts are app-only (avoid clobbering Kafka broker KAFKA_* service env).
integration:
  stage: test
  image: maven:3.9.11-eclipse-temurin-25
  variables:
    FF_NETWORK_PER_BUILD: 1
    POSTGRES_DB: blockchain
    POSTGRES_USER: blockchain
    POSTGRES_PASSWORD: blockchain
    TEST_DB_HOST: postgres
    TEST_MONGO_HOST: blockchain_db
    TEST_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  services:
    - name: postgres:16
      alias: postgres
    - name: mongo:7.0
      alias: blockchain_db
    - name: apache/kafka-native:3.8.1
      alias: kafka
  before_script:
    - |
      for i in $(seq 1 30); do
        (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && echo "postgres ready" && break
        echo "waiting for postgres ($i)..."
        sleep 2
      done
    - |
      for i in $(seq 1 30); do
        (echo > /dev/tcp/blockchain_db/27017) >/dev/null 2>&1 && echo "mongo ready" && break
        echo "waiting for mongo ($i)..."
        sleep 2
      done
    - |
      for i in $(seq 1 30); do
        (echo > /dev/tcp/kafka/9092) >/dev/null 2>&1 && echo "kafka ready" && break
        echo "waiting for kafka ($i)..."
        sleep 2
      done
  script:
    # JBlock is public on GitLab Packages — do not pass Job-Token (cross-project 401).
    - mvn test

graalvm.native:
  stage: build
  image: ghcr.io/graalvm/native-image-community:25.0.0
  needs: ["integration"]
  script:
    - ./mvnw package -Pnative -DskipTests=true
  artifacts:
    paths:
      - target/*-runner
  allow_failure: true

jvm.package:
  stage: build
  image: maven:3.9.11-eclipse-temurin-25
  needs: ["integration"]
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/quarkus-app/

docker.jvm:
  stage: package
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  needs: ["jvm.package"]
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f src/main/docker/Dockerfile.jvm -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  environment:
    name: test
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
