variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

stages:
  - test
  - build
  - package

# Explicit Postgres + Kafka services. %test pins URLs (no Dev Services / Testcontainers).
# TEST_* hosts are app-only (avoid clobbering Kafka broker KAFKA_* service env).
integration:
  stage: test
  image: maven:3.9.11-eclipse-temurin-25
  variables:
    FF_NETWORK_PER_BUILD: 1
    POSTGRES_DB: blockchain
    POSTGRES_USER: blockchain
    POSTGRES_PASSWORD: blockchain
    TEST_DB_HOST: postgres
    TEST_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  services:
    - name: postgres:16
      alias: postgres
    - name: apache/kafka-native:3.8.1
      alias: kafka
  before_script:
    - |
      for i in $(seq 1 30); do
        (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && echo "postgres ready" && break
        echo "waiting for postgres ($i)..."
        sleep 2
      done
    - |
      for i in $(seq 1 30); do
        (echo > /dev/tcp/kafka/9092) >/dev/null 2>&1 && echo "kafka ready" && break
        echo "waiting for kafka ($i)..."
        sleep 2
      done
  script:
    # JBlock is public on GitLab Packages — do not pass Job-Token (cross-project 401).
    - mvn test

graalvm.native:
  stage: build
  # The image's ENTRYPOINT is native-image; clear it so the runner can start a shell.
  image:
    name: ghcr.io/graalvm/native-image-community:25.0.0
    entrypoint: [""]
  needs: ["integration"]
  script:
    # Small SaaS runner has 8 GB RAM: cap the native-image builder heap to avoid OOM kills.
    - ./mvnw -B package -Pnative -DskipTests=true -Dquarkus.native.native-image-xmx=6g
  artifacts:
    paths:
      - target/*-runner
  allow_failure: true

jvm.package:
  stage: build
  image: maven:3.9.11-eclipse-temurin-25
  needs: ["integration"]
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/quarkus-app/

docker.jvm:
  stage: package
  image: docker:24
  # docker:24-dind already gets the "docker" alias from its image name.
  services:
    - docker:24-dind
  variables:
    # dockerd reads DOCKER_DRIVER; the legacy "overlay" driver was removed in Docker 24
    # and made dind exit at startup ("Cannot connect to the Docker daemon").
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  cache: []
  needs: ["jvm.package"]
  before_script:
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && echo "docker ready" && break
        echo "waiting for docker daemon ($i)..."
        sleep 2
      done
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f src/main/docker/Dockerfile.jvm -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  environment:
    name: test
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
