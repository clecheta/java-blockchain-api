stages:
  - test
  - build

before_script:
  - echo "before script"
  - echo $CI_COMMIT_BRANCH

integration:
  stage: test
  image: openjdk:11
  script:
    - ./mvnw test -B -s ci_settings.xml

graalvm.native:
  stage: build
  image: ghcr.io/graalvm/graalvm-ce:20.3.1.2
  before_script:
    - gu install native-image
  script:
    - ./mvnw package -s ci_settings.xml -Pnative -DskipTests=true
  artifacts:
    paths:
    - target/*-runner