.zoo_service: &zoo_service
  name: zookeeper:latest
  alias: zookeeper

.kafka_service: &kafka_service
  name: bitnami/kafka:latest
  alias: kafka

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_DRIVER: overlay
  SPRING_PROFILES_ACTIVE: gitlab-ci
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

stages:
  - test
  - build
  - package

integration:
  variables:
    FF_NETWORK_PER_BUILD: 1
    ALLOW_ANONYMOUS_LOGIN: "yes"
    KAFKA_BROKER_ID: 1
    KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092"
    KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
    KAFKA_CFG_ZOOKEEPER_CONNECT: "zookeeper:2181"
    ALLOW_PLAINTEXT_LISTENER: "yes"  
  stage: test
  image: maven:3.8.5-openjdk-17
  before_script:
    - docker-compose up -d
  services:
    - name: git.okaut.com:5050/infra/test/mongo:blockchain
      alias: blockchain_db
    - *zoo_service
    - *kafka_service
  script:
    - mvn test -B -s ci_settings.xml -Dquarkus.mongodb.connection-string=mongodb://blockchain_db:27017

graalvm.native:
  stage: build
  image: ghcr.io/graalvm/graalvm-ce:22.0.0.2
  before_script:
    - gu install native-image
  script:
    - ./mvnw package -s ci_settings.xml -Pnative -DskipTests=true
  artifacts:
    paths:
      - target/*-runner

docker.test:
  stage: package
  image:
    name: docker:dind
  tags:
    - dind
  before_script:
    - docker info
    - docker login -u gitlab-ci-token -p $INFRA_TEST_TOKEN $CI_REGISTRY
  script:
    - docker build -f src/main/docker/Dockerfile.native -t $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA $CI_REGISTRY/infra/test/api.blockchain:latest
    - docker push $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY/infra/test/api.blockchain:latest
  environment:
    name: test
  only:
    - master