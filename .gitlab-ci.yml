variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_DRIVER: overlay
  SPRING_PROFILES_ACTIVE: gitlab-ci

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

stages:
  - test
  - build
  - package

# Explicit Mongo/Kafka services; Dev Services disabled so CI does not need Docker-in-Docker.
integration:
  stage: test
  image: maven:3.9.11-eclipse-temurin-25
  variables:
    FF_NETWORK_PER_BUILD: 1
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  services:
    - name: mongo:7.0
      alias: blockchain_db
    - name: apache/kafka-native:3.8.1
      alias: kafka
  script:
    - >
      mvn test -s ci_settings.xml
      -Dquarkus.mongodb.devservices.enabled=false
      -Dquarkus.kafka.devservices.enabled=false
      -Dquarkus.mongodb.connection-string=mongodb://blockchain_db:27017
      -Dkafka.bootstrap.servers=kafka:9092
      -Dquarkus.http.test-port=0


graalvm.native:
  stage: build
  image: ghcr.io/graalvm/native-image-community:25.0.0
  script:
    - ./mvnw package -s ci_settings.xml -Pnative -DskipTests=true
  artifacts:
    paths:
      - target/*-runner
  allow_failure: true

docker.test:
  stage: package
  image:
    name: docker:dind
  tags:
    - dind
  before_script:
    - docker info
    - docker login -u gitlab-ci-token -p $INFRA_TEST_TOKEN $CI_REGISTRY
  script:
    - docker build -f src/main/docker/Dockerfile.native -t $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA $CI_REGISTRY/infra/test/api.blockchain:latest
    - docker push $CI_REGISTRY/infra/test/api.blockchain:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY/infra/test/api.blockchain:latest
  environment:
    name: test
  only:
    - master
