stages:
  - test
  - visualize
  - build

include:
  - template: Code-Quality.gitlab-ci.yml

before_script:
  - echo "before script"
  - echo $CI_COMMIT_BRANCH

code_quality:
  services: # Shut off Docker-in-Docker
  tags:
    - cq-sans-dind # Set this job to only run on our specialized runner
  artifacts:
    paths: [gl-code-quality-report.json]

integration:
  stage: test
  image: openjdk:11
  #services:
    #- name: git.okaut.com:5050/dev/infra/ci/mongo:oktdb
      #alias: oktdb
  script:
    - ./mvnw test -B -s ci_settings.xml #-Dquarkus.mongodb.connection-string=mongodb://oktdb:27017
  artifacts:
    paths:
      - target/jacoco-report/*

cobertura: # Must be in a stage later than test's stage.
  stage: visualize
  image: registry.gitlab.com/haynes/jacoco2cobertura:1.0.7
  script:
    # convert report from jacoco to cobertura, using relative project path
    - python /opt/cover2cover.py target/jacoco-report/jacoco.xml $CI_PROJECT_DIR/src/main/java/ > target/cobertura.xml
  needs: ["integration"]
  dependencies:
    - integration
  artifacts:
    reports:
      cobertura: target/cobertura.xml
  only:
    - master

graalvm.native:
  stage: build
  image: ghcr.io/graalvm/graalvm-ce:20.3.1.2
  before_script:
    - gu install native-image
  script:
    - ./mvnw package -s ci_settings.xml -Pnative -DskipTests=true
  artifacts:
    paths:
    - target/*-runner